    /* SSR fallback content styling */

      margin: 0 auto;
      padding: 2rem;

      padding-left: 1.5rem;
    }

      margin-bottom: 0.5rem;
    }

      color: #0080ff;
      text-decoration: underline;
    }

      <div style="display:flex;gap:1rem">

        </div>
