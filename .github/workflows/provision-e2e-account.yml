name: Provision E2E account

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  provision:
    name: Create isolated staging E2E user
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Create account through Supabase Auth
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          E2E_TEST_EMAIL: ${{ secrets.E2E_TEST_EMAIL }}
          E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail

          payload="$(jq -n \
            --arg email "$E2E_TEST_EMAIL" \
            --arg password "$E2E_TEST_PASSWORD" \
            --arg name "LinkMAX E2E" \
            '{email:$email,password:$password,data:{full_name:$name}}')"

          response_file="$(mktemp)"
          status="$(curl --fail-with-body --silent --show-error \
            --output "$response_file" --write-out '%{http_code}' \
            --request POST "$SUPABASE_URL/auth/v1/signup" \
            --header "apikey: $SUPABASE_KEY" \
            --header 'Content-Type: application/json' \
            --data "$payload")"

          if [[ "$status" != "200" && "$status" != "201" ]]; then
            echo "Supabase signup failed with HTTP $status"
            jq -c '{error: .error, message: .msg, description: .error_description}' "$response_file" || true
            exit 1
          fi

          if ! jq -e '.user.id and (.access_token | length > 0)' "$response_file" >/dev/null; then
            echo 'Supabase signup did not return an active session; email confirmation may be required.'
            exit 1
          fi

          echo 'Isolated E2E account created with an active session.'
