name: Deploy Staging

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: deploy-staging
  cancel-in-progress: false

permissions:
  contents: read
  deployments: write

env:
  NODE_VERSION: "22"
  SUPABASE_CLI_VERSION: "2.116.0"
  WRANGLER_VERSION: "4.127.1"

jobs:
  deploy:
    name: Staging
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: staging
    steps:
      - name: Resolve green main SHA
        id: source
        env:
          WORKFLOW_SHA: ${{ github.event.workflow_run.head_sha }}
          DISPATCH_SHA: ${{ github.sha }}
        run: echo "sha=${WORKFLOW_SHA:-$DISPATCH_SHA}" >> "$GITHUB_OUTPUT"
      - name: Checkout exact green commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ steps.source.outputs.sha }}
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1 # v1
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}
      - run: npm ci
      - name: Validate staging credentials
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_WORKER_SUPABASE_PROJECT: ${{ secrets.CF_WORKER_SUPABASE_PROJECT }}
          CF_WORKER_SUPABASE_ANON_KEY: ${{ secrets.CF_WORKER_SUPABASE_ANON_KEY }}
        run: |
          for name in SUPABASE_ACCESS_TOKEN SUPABASE_PROJECT_ID SUPABASE_DB_PASSWORD CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID CF_WORKER_SUPABASE_PROJECT CF_WORKER_SUPABASE_ANON_KEY; do
            test -n "${!name}" || { echo "::error::Missing staging secret: $name"; exit 1; }
          done
      - name: Build staging assets once
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: npm run build
      - name: Check migration history
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase migration list --project-ref "${{ secrets.SUPABASE_PROJECT_ID }}"
      - name: Apply database migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase db push --project-ref "${{ secrets.SUPABASE_PROJECT_ID }}" --password "$SUPABASE_DB_PASSWORD"
      - name: Deploy Edge Functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy --project-ref "${{ secrets.SUPABASE_PROJECT_ID }}"
      - name: Verify Supabase health
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          curl --fail --silent --show-error "$SUPABASE_URL/rest/v1/" -H "apikey: $SUPABASE_KEY" -o /dev/null
      - name: Upload and promote staging Worker version
        id: cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WORKER_PROJECT: ${{ secrets.CF_WORKER_SUPABASE_PROJECT }}
          WORKER_ANON_KEY: ${{ secrets.CF_WORKER_SUPABASE_ANON_KEY }}
          RELEASE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          SECRETS_FILE="$RUNNER_TEMP/worker-secrets.json"
          jq -n --arg project "$WORKER_PROJECT" --arg key "$WORKER_ANON_KEY" '{SUPABASE_PROJECT:$project,SUPABASE_ANON_KEY:$key}' > "$SECRETS_FILE"
          chmod 600 "$SECRETS_FILE"
          OUTPUT=$(npx --yes wrangler@4.127.1 versions upload --cwd cloudflare-worker --env staging --strict --preview-alias "staging-${RELEASE_SHA:0:7}" --tag "$RELEASE_SHA" --message "staging $RELEASE_SHA" --secrets-file "$SECRETS_FILE" --var "APP_VERSION:3.1.1" --var "APP_ENVIRONMENT:staging" --var "GIT_SHA:$RELEASE_SHA")
          printf '%s\n' "$OUTPUT"
          VERSION_ID=$(printf '%s\n' "$OUTPUT" | grep -Eo '[0-9a-f]{8}-[0-9a-f-]{27,}' | tail -1)
          PREVIEW_URL=$(printf '%s\n' "$OUTPUT" | grep -Eo 'https://[^ ]+workers\.dev' | tail -1)
          test -n "$VERSION_ID"
          test -n "$PREVIEW_URL"
          curl --fail --silent --show-error "$PREVIEW_URL/.well-known/linkmax-release.json" | jq -e --arg sha "$RELEASE_SHA" '.commitSha == $sha and .environment == "staging"'
          npx --yes wrangler@4.127.1 versions deploy "$VERSION_ID@100%" --cwd cloudflare-worker --env staging --yes --message "staging $RELEASE_SHA"
          echo "version_id=$VERSION_ID" >> "$GITHUB_OUTPUT"
          echo "preview_url=$PREVIEW_URL" >> "$GITHUB_OUTPUT"
          rm -f "$SECRETS_FILE"
      - name: Staging smoke tests
        env:
          BASE_URL: ${{ steps.cloudflare.outputs.preview_url }}
        run: |
          curl --fail --silent --show-error "$BASE_URL/" -o /dev/null
          curl --fail --silent --show-error "$BASE_URL/auth" -o /dev/null
          curl --fail --silent --show-error "$BASE_URL/pricing" -o /dev/null
          curl --fail --silent --show-error "$BASE_URL/sitemap.xml" -o /dev/null
      - name: Deployment summary
        run: |
          echo "### Staging deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: ${{ steps.source.outputs.sha }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Cloudflare version: ${{ steps.cloudflare.outputs.version_id }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Preview: ${{ steps.cloudflare.outputs.preview_url }}" >> "$GITHUB_STEP_SUMMARY"
