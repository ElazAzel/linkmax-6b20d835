name: Deploy Supabase Functions

on:
  push:
    branches:
      - main
    paths:
      - 'supabase/functions/**'
      - 'supabase/migrations/**'
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy Supabase (optional)
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Check Supabase secrets
        id: secrets
        run: |
          if [ -n "$SUPABASE_ACCESS_TOKEN" ] && [ -n "$SUPABASE_PROJECT_ID" ]; then
            echo "has_secrets=true" >> $GITHUB_OUTPUT
          else
            echo "has_secrets=false" >> $GITHUB_OUTPUT
            echo "Supabase secrets not configured, skipping..."
          fi

      - name: Deploy Edge Functions
        if: steps.secrets.outputs.has_secrets == 'true'
        run: supabase functions deploy --project-ref $SUPABASE_PROJECT_ID

      - name: Link Supabase project
        if: steps.secrets.outputs.has_secrets == 'true'
        run: supabase link --project-ref $SUPABASE_PROJECT_ID

      - name: Apply database migrations
        if: steps.secrets.outputs.has_secrets == 'true'
        run: supabase db push --linked

      - name: Deploy skipped
        if: steps.secrets.outputs.has_secrets != 'true'
        run: echo "Supabase deploy skipped - secrets not configured"