name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:

  editor-sheet-changes:
    name: Detect Editor Sheet Changes
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    outputs:
      editor_sheet_changed: ${{ steps.filter.outputs.editor_sheet }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect file changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            editor_sheet:
              - 'src/components/editor/**'
              - 'src/components/ui/sheet.tsx'

  quality:
    name: Quality Checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Quality Baseline Guardrail
        run: npm run quality:baseline

      - name: Hardened Quality Gate
        run: npm run quality:check

      # Audit 2026-05-16: block merges that introduce dependency cycles
      # or break i18n key coverage across ru/en/kk/uz.
      - name: Dependency Cycles
        run: npm run analyze:cycles

      - name: Locale Coverage
        run: npm run i18n:check-coverage

  unit-tests:
    name: Unit Tests (with Coverage)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests with coverage
        run: npm run test:ci

  e2e-tests:
    name: E2E Tests (optional)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [quality]
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check E2E secrets
        id: secrets
        run: |
          if [ -n "${{ secrets.E2E_TEST_EMAIL }}" ] && [ -n "${{ secrets.E2E_TEST_PASSWORD }}" ] && [ -n "${{ secrets.VITE_SUPABASE_URL }}" ] && [ -n "${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}" ]; then
            echo "has_secrets=true" >> $GITHUB_OUTPUT
          else
            echo "has_secrets=false" >> $GITHUB_OUTPUT
            echo "E2E secrets not fully configured, skipping..."
          fi

      - name: Install Playwright browsers
        if: steps.secrets.outputs.has_secrets == 'true'
        run: npx playwright install --with-deps

      - name: Test Supabase connectivity
        if: steps.secrets.outputs.has_secrets == 'true'
        run: |
          curl -sf "${{ secrets.VITE_SUPABASE_URL }}/rest/v1/" -H "apikey: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}" > /dev/null && echo "supabase_ok=true" >> $GITHUB_OUTPUT || echo "supabase_ok=false" >> $GITHUB_OUTPUT

      - name: E2E tests
        if: steps.secrets.outputs.has_secrets == 'true' && steps.connectivity.outputs.supabase_ok == 'true'
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          E2E_TEST_EMAIL: ${{ secrets.E2E_TEST_EMAIL }}
          E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}
        run: npm run e2e:ci
        continue-on-error: true

      - name: E2E skipped
        if: steps.secrets.outputs.has_secrets != 'true' || steps.connectivity.outputs.supabase_ok != 'true'
        run: echo "E2E tests skipped - secrets missing or Supabase unreachable"

  editor-sheet-required:
    name: Editor Add-Block Sheet Check (optional)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [quality, unit-tests, editor-sheet-changes]
    if: github.event_name == 'pull_request' && needs.editor-sheet-changes.outputs.editor_sheet_changed == 'true'
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run add-block sheet e2e (desktop + mobile)
        run: npx playwright test e2e/add-block-sheet.spec.ts e2e/editor-add-block-sheet.spec.ts --project=chromium --reporter=line
        continue-on-error: true

  build:
    name: Build Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [quality]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build